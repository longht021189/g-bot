name: Build Chaos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    name: build (${{ matrix.target.goos }}-${{ matrix.target.goarch }})
    runs-on: ubuntu-26.04-arm
    environment: chaos
    steps:
      - name: Checkout source
        uses: longht021189/g-bot/.github/actions/checkout@main
        env:
          CHECKOUT_REPOSITORY: ${{ secrets.CHECKOUT_REPOSITORY }}
          CHECKOUT_PATH: source
          CHECKOUT_SSH_KEY: ${{ secrets.CHECKOUT_SSH_KEY }}

      - name: Set up Go
        uses: longht021189/g-bot/.github/actions/setup-go@main
        env:
          SETUP_GO_VERSION: stable

      - name: Build and encrypt
        id: build
        uses: longht021189/g-bot/.github/actions/build-chaos@main
        env:
          BUILD_CHAOS_SOURCE: source
          BUILD_CHAOS_PASSPHRASE: ${{ secrets.CHAOS_ARTIFACT_PASSPHRASE }}
          BUILD_CHAOS_GOOS: ${{ matrix.target.goos }}
          BUILD_CHAOS_GOARCH: ${{ matrix.target.goarch }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: chaos-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error
          retention-days: 1
