name: build-chaos
description: "Builds every binary of a chaos checkout for the runner's own platform (build.js, which also builds locally) and adds them to the chaos repository's bin branch, whose commit message names the chaos commit built. Settings come from the step's env."
outputs:
  source-commit:
    description: The chaos commit built.
  commit:
    description: The commit on that branch.
runs:
  using: node24
  main: main.js
  post: post.js
