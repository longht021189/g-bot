name: Build Chaos

on:
  workflow_dispatch:
    inputs:
      darwin-arm64:
        description: darwin-arm64 (macOS, Apple Silicon)
        type: boolean
        default: true
      linux-arm64:
        description: linux-arm64
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: chaos-bin

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Plan the platforms
        id: plan
        uses: longht021189/g-bot/.github/actions/plan-platforms@main
        env:
          PLAN_PLATFORMS_FOR: chaos
          PLAN_PLATFORMS: >-
            ${{ inputs.darwin-arm64 && 'darwin-arm64' || '' }}
            ${{ inputs.linux-arm64 && 'linux-arm64' || '' }}

  build:
    needs: plan
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: chaos
    steps:
      - name: Checkout source
        uses: longht021189/g-bot/.github/actions/checkout@main
        env:
          CHECKOUT_REPOSITORY: ${{ secrets.CHECKOUT_REPOSITORY }}
          CHECKOUT_PATH: source
          CHECKOUT_SSH_KEY: ${{ secrets.CHECKOUT_SSH_KEY }}

      # Next to the source, where its .cargo/config.toml patch and r-share's
      # build.rs look for them.
      - name: Checkout r-share
        uses: longht021189/g-bot/.github/actions/checkout@main
        env:
          CHECKOUT_REPOSITORY: https://github.com/longht021189/r-share.git
          CHECKOUT_PATH: r-share

      - name: Checkout c-share
        uses: longht021189/g-bot/.github/actions/checkout@main
        env:
          CHECKOUT_REPOSITORY: https://github.com/longht021189/c-share.git
          CHECKOUT_PATH: c-share

      # c-share's dependencies, prebuilt: vcpkg-share's deps branch.
      - name: Checkout vcpkg-share's deps
        uses: longht021189/g-bot/.github/actions/checkout@main
        env:
          CHECKOUT_REPOSITORY: https://github.com/longht021189/vcpkg-share.git
          CHECKOUT_REF: deps
          CHECKOUT_PATH: vcpkg-share-deps

      - name: Set up Go
        uses: longht021189/g-bot/.github/actions/setup-go@main
        env:
          SETUP_GO_VERSION: stable

      - name: Build and push
        uses: longht021189/g-bot/.github/actions/build-chaos@main
        env:
          BUILD_CHAOS_SOURCE: source
          BUILD_CHAOS_DEPS: vcpkg-share-deps
