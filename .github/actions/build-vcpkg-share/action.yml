name: build-vcpkg-share
description: "Builds one platform's prefix of a vcpkg-share checkout (build.js, which also builds locally) and adds it to the repository's deps branch, whose commit message names the deps hash. Settings come from the step's env."
outputs:
  hash:
    description: The deps hash the prefix was built from.
  commit:
    description: The commit on that branch.
runs:
  using: node24
  main: main.js
  post: post.js
