name: Build vcpkg-share

on:
  workflow_dispatch:
    inputs:
      darwin-arm64:
        description: darwin-arm64 (macOS, Apple Silicon)
        type: boolean
        default: true
      linux-arm64:
        description: linux-arm64
        type: boolean
        default: true
      linux-x64:
        description: linux-x64
        type: boolean
        default: false
      android-arm64:
        description: android-arm64 (arm64-v8a)
        type: boolean
        default: false
      android-armv7:
        description: android-armv7 (armeabi-v7a)
        type: boolean
        default: false
      android-x86_64:
        description: android-x86_64 (emulator)
        type: boolean
        default: false
      android-x86:
        description: android-x86 (legacy emulator)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vcpkg-share-deps

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Plan the platforms
        id: plan
        uses: longht021189/g-bot/.github/actions/plan-vcpkg-share@main
        env:
          PLAN_VCPKG_SHARE_PLATFORMS: >-
            ${{ inputs.darwin-arm64 && 'darwin-arm64' || '' }}
            ${{ inputs.linux-arm64 && 'linux-arm64' || '' }}
            ${{ inputs.linux-x64 && 'linux-x64' || '' }}
            ${{ inputs.android-arm64 && 'android-arm64' || '' }}
            ${{ inputs.android-armv7 && 'android-armv7' || '' }}
            ${{ inputs.android-x86_64 && 'android-x86_64' || '' }}
            ${{ inputs.android-x86 && 'android-x86' || '' }}

  build:
    needs: plan
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: vcpkg-share
    steps:
      - name: Checkout source
        uses: longht021189/g-bot/.github/actions/checkout@main
        env:
          CHECKOUT_REPOSITORY: ${{ secrets.CHECKOUT_REPOSITORY }}
          CHECKOUT_PATH: source
          CHECKOUT_SSH_KEY: ${{ secrets.CHECKOUT_SSH_KEY }}

      - name: Build and push
        uses: longht021189/g-bot/.github/actions/build-vcpkg-share@main
        env:
          BUILD_VCPKG_SHARE_SOURCE: source
          BUILD_VCPKG_SHARE_PLATFORM: ${{ matrix.platform }}
